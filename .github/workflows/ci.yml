name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Ключ только для CI, нигде в проде не используется
      SECRET_KEY: ci-only-key-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: manage.py check
        run: python manage.py check

      - name: manage.py check --deploy (production variables)
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DEBUG: "False"
          SECRET_KEY: "T8m#Xq2$vL9pZr4&Wb7nKd1!Hc5@Ys3^Fg6*Ju0(Ae8)Pt2-Rn4=Vk7+Ox1"
          ALLOWED_HOSTS: shop.example.com
          HTTPS_ONLY: "True"

      - name: makemigrations --check
        run: python manage.py makemigrations --check --dry-run

      - name: pytest
        run: pytest --cov
